# LebanonPOS — Production Docker Compose (Local Server Mode)
#
# Use this to run the POS server on a local machine (no Electron needed).
# All devices on the same WiFi connect via browser to http://<this-machine-ip>:3001
#
# Setup:
#   1. cp .env.example .env
#   2. Fill in DB_PASSWORD, JWT_SECRET, and CLOUD_* vars in .env
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. First run: migrations run automatically on API startup
#
# Required .env vars for this file:
#   DB_PASSWORD    — PostgreSQL password (any strong value)
#   JWT_SECRET     — 32+ char random string
#   CORS_ORIGINS   — e.g. http://192.168.1.5:3001 (this machine's LAN IP)
#   CLOUD_API_URL  — Railway URL (optional, enables cloud backup)
#   CLOUD_API_KEY  — Shared secret matching Railway's CLOUD_API_KEY (optional)
#   CLOUD_TENANT_ID — Tenant UUID from Railway (optional)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lebanonpos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/lebanonpos"
      JWT_SECRET: "${JWT_SECRET}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3001}"
      PORT: "3001"
      NODE_ENV: production
      IS_LOCAL_SERVER: "true"
      CLOUD_API_URL: "${CLOUD_API_URL:-}"
      CLOUD_API_KEY: "${CLOUD_API_KEY:-}"
      CLOUD_TENANT_ID: "${CLOUD_TENANT_ID:-}"
    volumes:
      # Persist sync-state.json (stores lastPullAt) across container restarts
      - ./apps/api/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  pgdata_prod:
    # Separate from dev volume (docker-compose.yml uses pgdata)
    name: lebanonpos_pgdata_prod
